<div class="likes-list">
    <p class="text-danger" ng-if="error">{{error}}</p>
    <p ng-if="!error && posts.length === 0">No posts yet.</p>
    <article ng-repeat="post in posts">
        <h3>{{post.title}}</h3>
        <p>{{post.body}}</p>
        <button type="button" class="btn btn-link" ng-click="toggle(post)">{{post.liked ? 'Unlike' : 'Like'}}</button>
        <span class="like-count">{{post.likeCount}}</span>
    </article>
</div>
