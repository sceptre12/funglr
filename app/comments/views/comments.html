<div class="comments-list">
    <p class="text-danger" ng-if="error">{{error}}</p>
    <p ng-if="!error && posts.length === 0">No posts yet.</p>
    <article ng-repeat="post in posts">
        <h3>{{post.title}}</h3>
        <p>{{post.body}}</p>
        <ul class="list-unstyled">
            <li ng-repeat="comment in post.comments">
                <strong>{{comment.authorName}}</strong> {{comment.body}}
                <button type="button" class="btn btn-link" ng-if="comment.authorId === currentUserId" ng-click="remove(post, comment)">Delete</button>
            </li>
        </ul>
        <form ng-submit="add(post)">
            <input type="text" class="form-control" ng-model="post.newComment" placeholder="Add a comment">
            <button type="submit" class="btn btn-default">Comment</button>
        </form>
    </article>
</div>
