<div>
    <form name="imagepost" novalidate class="form-horizontal">
        <div class="modal-header">
            <h3 class="modal-title">{{typeOfPost}} Post</h3>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="title" class="col-sm-2 control-label">Title</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" id="title" placeholder="Title" ng-model="post.title" required>
                </div>
            </div>
            <div class="form-group">
                <label for="image" class="col-sm-2 control-label">Image</label>
                <div class="col-sm-10">
                    <input type="file" accept="image/*" class="form-control" id="image" image-file-input>
                </div>
            </div>
            <p class="text-danger" ng-if="error">{{error}}</p>
        </div>
        <div class="modal-footer">
            <button type="submit" class="btn btn-success" ng-click="insertImage()" ng-disabled="imagepost.$invalid || !file || busy">Submit</button>
            <button class="btn btn-warning" ng-click="cancel()">Cancel</button>
        </div>
    </form>
</div>
