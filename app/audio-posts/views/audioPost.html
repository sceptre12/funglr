<form name="audiopost" novalidate class="form-horizontal">
    <div class="modal-header">
        <h3 class="modal-title">{{typeOfPost}} Post</h3>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label for="title" class="col-sm-2 control-label">Title</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="title" placeholder="Title" ng-model="post.title">
            </div>
        </div>
        <div class="form-group">
            <label for="audioFile" class="col-sm-2 control-label">Audio</label>
            <div class="col-sm-10">
                <input type="file" id="audioFile" accept="audio/*" onchange="angular.element(this).scope().setFile(this.files[0]); angular.element(this).scope().$apply();">
            </div>
        </div>
        <p class="text-danger" ng-if="error">{{error}}</p>
    </div>
    <div class="modal-footer">
        <button type="submit" class="btn btn-success" ng-click="insertPost()">Submit</button>
        <button class="btn btn-warning" ng-click="cancel()">Cancel</button>
    </div>
</form>
