<div class="reblog-list">
    <p class="text-danger" ng-if="error">{{error}}</p>
    <p ng-if="!error && posts.length === 0">No posts yet.</p>
    <article ng-repeat="post in posts">
        <h3>{{post.title}}</h3>
        <p>{{post.body}}</p>
        <button type="button" class="btn btn-link" ng-click="toggle(post)">{{post.reblogged ? 'Unreblog' : 'Reblog'}}</button>
        <span class="reblog-count">{{post.reblogCount}}</span>
    </article>
</div>
